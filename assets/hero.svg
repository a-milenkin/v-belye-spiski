<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bg{fill:#eaf1ff}.wall{fill:#e5484d}.phone{fill:#0f1b33}.scr{fill:#fff}
  .bad rect{fill:#fff;stroke:#c9d3e6;stroke-width:1.5}.bad text{fill:#7a89a6;font-size:13px;font-weight:600}
  .good rect{fill:#e3f6ea;stroke:#12a150;stroke-width:1.5}.good text{fill:#0d7a3d;font-size:13px;font-weight:700}
  .you rect{fill:#0b6bff;stroke:#0852c9;stroke-width:1.5}.you text{fill:#fff;font-size:13px;font-weight:800}
  .cross{fill:#e5484d;font-size:16px;font-weight:800;opacity:0}
  /* серые сайты едут к барьеру и гаснут */
  .b1{animation:blk 6s linear infinite}.b2{animation:blk 6s linear -2s infinite}.b3{animation:blk 6s linear -4s infinite}
  @keyframes blk{0%{transform:translateX(0);opacity:0}8%{opacity:1}52%{transform:translateX(150px);opacity:1}62%{transform:translateX(150px) scale(.9);opacity:0}100%{transform:translateX(150px);opacity:0}}
  .x1{animation:xx 6s linear infinite}.x2{animation:xx 6s linear -2s infinite}.x3{animation:xx 6s linear -4s infinite}
  @keyframes xx{0%,50%{opacity:0;transform:scale(.4)}56%{opacity:1;transform:scale(1.2)}66%{opacity:1;transform:scale(1)}74%,100%{opacity:0}}
  /* зелёные проходят сквозь барьер до телефона */
  .g1{animation:ok 6s linear infinite}.g2{animation:ok 6s linear -2s infinite}.g3{animation:ok 6s linear -4s infinite}
  @keyframes ok{0%{transform:translateX(0);opacity:0}8%{opacity:1}85%{transform:translateX(262px);opacity:1}95%,100%{transform:translateX(262px);opacity:0}}
  .pulse{animation:pl 1.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .sig path{animation:sg 1.6s ease-in-out infinite;opacity:.25}.sig path:nth-child(2){animation-delay:.2s}.sig path:nth-child(3){animation-delay:.4s}
  @keyframes sg{0%,100%{opacity:.25}50%{opacity:1}}
  .wallglow{animation:wg 2.4s ease-in-out infinite}@keyframes wg{0%,100%{opacity:.35}50%{opacity:.75}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.b1,.b2,.b3,.g1,.g2,.g3{opacity:1}}
</style>
<rect class="bg" width="520" height="360" rx="20"/>
<text x="24" y="38" font-size="15" font-weight="800" fill="#0f1b33">Ограничения мобильного интернета</text>
<text x="24" y="58" font-size="12.5" fill="#5b6b88">Проходят только сайты из белого списка</text>

<!-- барьер -->
<rect class="wallglow" x="224" y="78" width="16" height="262" rx="8" fill="#e5484d" opacity=".4"/>
<rect class="wall" x="229" y="82" width="6" height="254" rx="3"/>
<text x="232" y="352" font-size="11" font-weight="700" fill="#c93a3f" text-anchor="middle">фильтр оператора</text>

<!-- обычные сайты: блокируются -->
<g class="bad"><g class="b1"><rect x="20" y="96" width="120" height="32" rx="10"/><text x="80" y="117" text-anchor="middle">ваш-конкурент.ру</text></g></g>
<g class="bad"><g class="b2"><rect x="20" y="146" width="120" height="32" rx="10"/><text x="80" y="167" text-anchor="middle">интернет-магазин</text></g></g>
<g class="bad"><g class="b3"><rect x="20" y="196" width="120" height="32" rx="10"/><text x="80" y="217" text-anchor="middle">мой-сайт.ру</text></g></g>
<text class="cross x1" x="222" y="117" text-anchor="middle">✕</text>
<text class="cross x2" x="222" y="167" text-anchor="middle">✕</text>
<text class="cross x3" x="222" y="217" text-anchor="middle">✕</text>

<!-- белый список: проходят -->
<g class="good"><g class="g1"><rect x="20" y="256" width="104" height="32" rx="10"/><text x="72" y="277" text-anchor="middle">Госуслуги</text></g></g>
<g class="good"><g class="g2"><rect x="20" y="296" width="104" height="32" rx="10"/><text x="72" y="317" text-anchor="middle">Сбер · Яндекс</text></g></g>

<!-- телефон -->
<g class="pulse">
  <rect class="phone" x="408" y="110" width="92" height="190" rx="18"/>
  <rect class="scr" x="416" y="126" width="76" height="158" rx="8"/>
  <rect x="440" y="116" width="28" height="4" rx="2" fill="#2b3a5c"/>
  <g class="sig" fill="none" stroke="#12a150" stroke-width="3" stroke-linecap="round" transform="translate(454 160)">
    <path d="M-14 -6 A20 20 0 0 1 14 -6"/><path d="M-9 0 A12 12 0 0 1 9 0"/><path d="M-4 6 A5 5 0 0 1 4 6"/>
  </g>
  <text x="454" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="#0d7a3d">открывается</text>
  <rect x="426" y="222" width="56" height="22" rx="7" fill="#e3f6ea" stroke="#12a150"/>
  <text x="454" y="237" text-anchor="middle" font-size="10" font-weight="800" fill="#0d7a3d">ваш сайт</text>
</g>
</svg>
